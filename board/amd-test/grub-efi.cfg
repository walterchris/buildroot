set default="0"
set timeout="5"

# Serial console configuration
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

menuentry "AMD Test Suite (Serial + VGA)" {
    linux /bzImage root=PARTUUID=UUID_TMP rootwait console=tty0 console=ttyS0,115200n8 iomem=relaxed
}

menuentry "AMD Test Suite (VGA only)" {
    linux /bzImage root=PARTUUID=UUID_TMP rootwait console=tty0 iomem=relaxed
}

menuentry "AMD Test Suite (Serial only)" {
    linux /bzImage root=PARTUUID=UUID_TMP rootwait console=ttyS0,115200n8 iomem=relaxed
}

menuentry "AMD Test Suite (Debug)" {
    linux /bzImage root=PARTUUID=UUID_TMP rootwait console=tty0 console=ttyS0,115200n8 iomem=relaxed earlyprintk=serial,ttyS0,115200 debug loglevel=8
}
