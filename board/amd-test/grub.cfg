set default="0"
set timeout="5"

# Serial console configuration
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

menuentry "AMD Test Suite (Serial + VGA)" {
    linux /boot/bzImage root=/dev/sda1 rootwait console=tty0 console=ttyS0,115200n8 iomem=relaxed mem_encrypt=on
    initrd /boot/initrd
}

menuentry "AMD Test Suite (VGA only)" {
    linux /boot/bzImage root=/dev/sda1 rootwait console=tty0 iomem=relaxed mem_encrypt=on
    initrd /boot/initrd
}

menuentry "AMD Test Suite (Serial only)" {
    linux /boot/bzImage root=/dev/sda1 rootwait console=ttyS0,115200n8 iomem=relaxed mem_encrypt=on
    initrd /boot/initrd
}

menuentry "AMD Test Suite (Debug mode)" {
    linux /boot/bzImage root=/dev/sda1 rootwait console=tty0 console=ttyS0,115200n8 iomem=relaxed mem_encrypt=on earlyprintk=serial,ttyS0,115200 debug loglevel=8
    initrd /boot/initrd
}
